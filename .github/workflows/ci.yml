name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - name: Ruby syntax
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -name '*.rb' -not -path './.git/*' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Ruby files found"
            exit 1
          fi
          for f in "${files[@]}"; do
            ruby -c "$f"
          done
      - name: ERB compile
        run: |
          set -euo pipefail
          ruby -e '
            require "erb"
            files = Dir.glob("**/*.erb").sort
            abort("No ERB files found") if files.empty?
            files.each do |path|
              ERB.new(File.read(path), trim_mode: "-")
              puts "ERB ok: #{path}"
            end
          '
